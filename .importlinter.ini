# 分层依赖约束（import-linter）
# 运行：lint-imports（unittest 里由 tests/test_layering.py 自动执行）
#
# import-linter 的 root_packages 只认包（目录+__init__.py），平铺模块
# （config / 各引擎 / main）进不了它的依赖图。因此分工：
#   - 本文件：约束两个包的边界（api 接口层 / database 数据层）
#   - tests/test_layering.py 的 LayeringAstTests：用 AST 检查平铺模块的
#     分层规则（引擎不碰接口层 / config 是叶子 / 计算层纯净等）
# 分层（上层可依赖下层，禁止反向）：
#   main / api_server（组装入口）
#     → api（接口层：routers + history_service/kg_views）
#       → 引擎层（realtime_engine / auction_engine / sync_pipeline / sector_manage /
#                 kg_* / theme_catalyst / scan_push / trade_calendar / ifind_hub）
#         → 计算层（core_calculator / stock_scorer）
#         → 数据层（database）
#           → config（叶子）

[importlinter]
include_external_packages = True
root_packages =
    api
    database

[importlinter:contract:no-api-to-entrypoints]
name = 接口层不反向引用入口（api 不得 import api_server/main）
type = forbidden
source_modules = api
forbidden_modules = api_server, main

[importlinter:contract:no-database-to-upper]
name = 数据层不可反向依赖接口层与计算层
type = forbidden
source_modules = database
forbidden_modules = api, api_server, main, core_calculator, stock_scorer

[importlinter:contract:no-database-to-engines]
name = 数据层不依赖引擎层
type = forbidden
source_modules = database
forbidden_modules =
    realtime_engine
    auction_engine
    sync_pipeline
    sector_manage
    kg_sources
    kg_builder
    kg_analysis
    theme_catalyst
    scan_push
    open_scan_engine
    intraday_fetcher
    trade_calendar
